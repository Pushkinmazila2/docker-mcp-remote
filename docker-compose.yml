services:
  # Основной сервис HashiCorp Vault
  vault:
    image: hashicorp/vault:1.15
    container_name: docker-mcp-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    volumes:
      - ./vault/data:/vault/data
      - ./vault/config:/vault/config
      - ./vault/logs:/vault/logs
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    # Пишем конфиг прямо в команду, чтобы не создавать отдельный файл vault.hcl
    command: >
      server -config=- -inline='
        storage "file" { path = "/vault/data" }
        listener "tcp" { address = "0.0.0.0:8200" \n tls_disable = 1 }
        disable_mlock = true
      '
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 2s
      retries: 3

  # Сервис автоматической инициализации и распечатывания
  vault-unsealer:
    image: hashicorp/vault:1.15
    container_name: docker-mcp-vault-unsealer
    restart: unless-stopped
    volumes:
      # Папка для сохранения ключей на хост (скройте ее в продакшене!)
      - ./vault/init-keys:/vault/init-keys
    environment:
      VAULT_ADDR: "http://vault:8200"
    depends_on:
      vault:
        condition: service_started
    entrypoint: /bin/sh -c
    command: >
      "
      KEYS_FILE='/vault/init-keys/keys.json'

      # Ждем, пока Vault начнет отвечать по сети
      until vault status -address=http://vault:8200 2>&1 | grep -q 'unsealed\|sealed'; do
        echo 'Ожидание запуска Vault...'
        sleep 2
      done

      # Инициализация, если файл с ключами еще не создан
      if [ ! -f \"$$KEYS_FILE\" ]; then
        echo 'Инициализация Vault...'
        mkdir -p /vault/init-keys
        vault operator init -address=http://vault:8200 -format=json -key-shares=1 -key-threshold=1 > \"$$KEYS_FILE\"
        echo 'Vault успешно инициализирован. Ключи сохранены.'
      fi

      # Цикл автоматического распечатывания при перезапусках
      while true; do
        if vault status -address=http://vault:8200 | grep -q 'Sealed.*true'; then
          echo 'Vault заблокирован (sealed). Распечатываю...'
          UNSEAL_KEY=$$(cat \"$$KEYS_FILE\" | jq -r '.unseal_keys_b64[0]')
          vault operator unseal -address=http://vault:8200 \"$$UNSEAL_KEY\"
        fi
        sleep 10
      done
      "


  mcp-hub:
    build: .
    image: docker-mcp-hub:latest
    container_name: docker-mcp-hub
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data        # servers.json (fallback only)
      - ./keys:/keys        # SSH ключи (только для импорта при старте)
    environment:
      DATA_DIR: /data
      KEYS_DIR: /keys
      
      # Vault Configuration - HashiCorp Vault (REQUIRED)
      # All SSH keys and secrets are stored in Vault
      # Local storage is only used as fallback for server configs
      
      VAULT_TYPE: "hashicorp"  # hashicorp (default) | aws | local (not recommended)
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root-token-change-me"  # !! Change in production !!
      VAULT_SECRET_PATH: "secret/data/docker-mcp-hub"
      
      # Access tokens (optional - will be auto-generated if not set)
      # MCP_USER_TOKEN: "your-custom-user-token"
      # MCP_ADMIN_TOKEN: "your-custom-admin-token"
      # WEB_UI_TOKEN: "your-custom-webui-token"
      
      # To use Local File Storage instead, set:
      # VAULT_TYPE: "local"
      
      # To use AWS Secrets Manager instead, set:
      # VAULT_TYPE: "aws"
      # AWS_SECRET_NAME: "docker-mcp-hub/master-keys"
      # AWS_REGION: "us-east-1"
      # AWS_ACCESS_KEY_ID: "your-access-key"
      # AWS_SECRET_ACCESS_KEY: "your-secret-key"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
