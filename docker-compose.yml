services:
  vault:
    image: hashicorp/vault:1.15
    container_name: docker-mcp-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    volumes:
      - ./vault/data:/vault/data
      - ./vault/logs:/vault/logs
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_LOCAL_CONFIG: '{"storage": {"file": {"path": "/vault/data"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": 1}}, "disable_mlock": true}'
    cap_add:
      - IPC_LOCK
    command: server

  vault-unsealer:
    image: hashicorp/vault:1.15
    container_name: docker-mcp-vault-unsealer
    restart: unless-stopped
    volumes:
      - ./vault/init-keys:/vault/init-keys
    environment:
      VAULT_ADDR: "http://vault:8200"
    depends_on:
      - vault
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      KEYS_FILE='/vault/init-keys/keys.json';
      while true; do
        STATUS=$$(vault status -address=http://vault:8200 2>&1);
        echo \"$$STATUS\" | grep -q 'unsealed' && sleep 15 && continue;
        if echo \"$$STATUS\" | grep -q 'sealed.*true'; then
          echo 'Vault заблокирован. Распечатываю...';
          UNSEAL_KEY=$$(cat \"$$KEYS_FILE\" | grep -o '\"unseal_keys_b64\": *\[\"[^\"]*\"' | sed 's/.*\"\(.*\)\"/\1/');
          vault operator unseal -address=http://vault:8200 \"$$UNSEAL_KEY\";
        elif echo \"$$STATUS\" | grep -q 'Vault is not initialized'; then
          if [ ! -f \"$$KEYS_FILE\" ]; then
            echo 'Инициализация Vault...';
            mkdir -p /vault/init-keys;
            vault operator init -address=http://vault:8200 -key-shares=1 -key-threshold=1 -format=json > \"$$KEYS_FILE\";
            echo 'Инициализация успешна.';
          else
            echo 'Файл ключей найден, но Vault не инициализирован. Проверьте данные!';
          fi;
        else
          echo 'Ожидание доступности API Vault...';
        fi;
        sleep 5;
      done
      "



  mcp-hub:
    build: .
    image: docker-mcp-hub:latest
    container_name: docker-mcp-hub
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data        # servers.json (fallback only)
      - ./keys:/keys        # SSH ключи (только для импорта при старте)
    environment:
      DATA_DIR: /data
      KEYS_DIR: /keys
      
      # Vault Configuration - HashiCorp Vault (REQUIRED)
      # All SSH keys and secrets are stored in Vault
      # Local storage is only used as fallback for server configs
      
      VAULT_TYPE: "hashicorp"  # hashicorp (default) | aws | local (not recommended)
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root-token-change-me"  # !! Change in production !!
      VAULT_SECRET_PATH: "secret/data/docker-mcp-hub"
      
      # Access tokens (optional - will be auto-generated if not set)
      # MCP_USER_TOKEN: "your-custom-user-token"
      # MCP_ADMIN_TOKEN: "your-custom-admin-token"
      # WEB_UI_TOKEN: "your-custom-webui-token"
      
      # To use Local File Storage instead, set:
      # VAULT_TYPE: "local"
      
      # To use AWS Secrets Manager instead, set:
      # VAULT_TYPE: "aws"
      # AWS_SECRET_NAME: "docker-mcp-hub/master-keys"
      # AWS_REGION: "us-east-1"
      # AWS_ACCESS_KEY_ID: "your-access-key"
      # AWS_SECRET_ACCESS_KEY: "your-secret-key"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
